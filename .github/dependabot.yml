# Dependabot for this repository. Mirrors the rest of the org.
#
# TWO groups per ecosystem, and the second one is the point: `groups` applies
# only to version updates unless a group says `applies-to: security-updates`.
# Without it, every security fix arrives as its own pull request — which is how
# enabling security updates across the org opened dozens at once. Grouped, an
# ecosystem's security fixes land in one pull request instead.
#
# Minor and patch land in one grouped pull request per ecosystem per week;
# majors get their own so they are easy to review and to revert.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      # Biome gets a group of its own, and that is the whole point of it.
      # A formatter upgrade rewrites every file it touches, so it must arrive as
      # one pull request that can carry its own reformat commit — not swept into
      # the weekly minor/patch batch, where it lands a new formatter with no
      # reformat and reddens CI on a change that touched nothing related. The
      # exact pin in package.json makes the upgrade visible; this keeps it alone.
      biome:
        patterns:
          - "@biomejs/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # @types/vscode is not a dependency choice, it is the declaration of which
      # VS Code versions this extension runs on: it must match engines.vscode,
      # and raising it drops support for every editor below the new floor. The
      # bump that prompted this proposed ^1.137.0 against engines ^1.85.0, which
      # the toolchain rejects outright. Move both together, by hand, when
      # dropping old editors is the actual intent.
      - dependency-name: "@types/vscode"

      # No major version pull requests. A major is a migration, not an update —
      # it wants reading, and a queue of them is a queue nobody reads.
      #
      # `update-types` and not `dependency-name`: an ignore written by name
      # silences security updates too, this form does not. If the only patched
      # version of an advisory is a new major, Dependabot still opens it.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

